name: Release

on:
  push:
    tags:
      - "v*"
    workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .pkg
        run: |
          mkdir -p pkg-root/usr/local/bin
          cp scripts/install-macos.sh pkg-root/usr/local/bin/whisperlab-install
          cp scripts/doctor-macos.sh pkg-root/usr/local/bin/whisperlab-doctor
          chmod +x pkg-root/usr/local/bin/*
          pkgbuild --identifier com.whisperlab.installer \
                   --version "${GITHUB_REF_NAME}" \
                   --root pkg-root \
                   --install-location / \
                   "whisperlab-${GITHUB_REF_NAME}.pkg"
      - name: Build .dmg
        run: |
          mkdir -p dmg-root/curriculum
          cp "whisperlab-${GITHUB_REF_NAME}.pkg" dmg-root/
          cp scripts/install-macos.sh dmg-root/
          cp README.md dmg-root/
          cp -R curriculum/resources dmg-root/curriculum/
          cp curriculum/README.md dmg-root/curriculum/
          hdiutil create -volname "WhisperLab" \
                         -srcfolder dmg-root \
                         -ov -format UDZO \
                         "whisperlab-${GITHUB_REF_NAME}.dmg"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            whisperlab-${GITHUB_REF_NAME}.pkg
            whisperlab-${GITHUB_REF_NAME}.dmg

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable whisperlab-api.exe
        run: |
          pip install pyinstaller
          pip install -e backend
          pyinstaller --onefile --name whisperlab-api backend/src/whisperlab/main.py
      - name: Bundle curriculum docs alongside the exe
        shell: bash
        run: |
          mkdir -p dist/curriculum
          cp -R curriculum/resources dist/curriculum/
          cp curriculum/README.md dist/curriculum/
          cp README.md dist/
      - name: Zip release bundle
        shell: bash
        run: |
          cd dist
          7z a "../whisperlab-${GITHUB_REF_NAME}-windows.zip" .
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: whisperlab-${{ github.ref_name }}-windows.zip

  build-docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:latest

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos-installers/*
            windows-installers/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
