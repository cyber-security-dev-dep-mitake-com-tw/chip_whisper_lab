# Choreo component config for the WhisperLab web app (Next.js/vinext).
# Component directory (build context) for this component in the Choreo console: . (repo root)
# Dockerfile path within this directory: app/Dockerfile
#
# Repo-root context is required here (not app/) because this is a single Next.js
# project rooted at the repo top level -- package.json, lib/, components/, and the
# curriculum/ content referenced by the /learn pages all live outside app/, which is
# only the Next.js App Router folder. See app/Dockerfile.
#
# Schema reference verified against:
# https://wso2.com/choreo/docs/develop-components/manage-component-source-configurations/
schemaVersion: 1.2

endpoints:
  - name: whisperlab-web
    displayName: WhisperLab Web App
    service:
      basePath: /
      port: 3000
    type: REST
    networkVisibilities:
      - Public
      - Organization

# NOTE: a `dependencies.connectionReferences` block wiring this app to the
# whisperlab-api component via a Choreo "Connection" is a natural next step, but
# its `resourceRef` value is generated by Choreo when you create the connection
# in the console (org/project/component-specific) -- it cannot be predicted here.
# Until that connection is created, set NEXT_PUBLIC_API_URL directly as a plain
# environment variable on this component in the Choreo console, pointing at the
# whisperlab-api component's public URL.
