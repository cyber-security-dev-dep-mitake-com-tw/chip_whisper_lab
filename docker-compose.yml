version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: whisperlab
      POSTGRES_PASSWORD: whisperlab
      POSTGRES_DB: whisperlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whisperlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: whisperlab
      MINIO_ROOT_PASSWORD: whisperlab123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      WHISPERLAB_DATABASE_URL: postgresql+asyncpg://whisperlab:whisperlab@postgres:5432/whisperlab
      WHISPERLAB_REDIS_URL: redis://redis:6379/0
      WHISPERLAB_MINIO_ENDPOINT: minio:9000
      WHISPERLAB_MINIO_ACCESS_KEY: whisperlab
      WHISPERLAB_MINIO_SECRET_KEY: whisperlab123
      WHISPERLAB_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./data:/data

  celery-worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A whisperlab.tasks worker --loglevel=info --concurrency=2
    environment:
      WHISPERLAB_DATABASE_URL: postgresql+asyncpg://whisperlab:whisperlab@postgres:5432/whisperlab
      WHISPERLAB_REDIS_URL: redis://redis:6379/0
      WHISPERLAB_MINIO_ENDPOINT: minio:9000
      WHISPERLAB_MINIO_ACCESS_KEY: whisperlab
      WHISPERLAB_MINIO_SECRET_KEY: whisperlab123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./data:/data

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  # Per-user notebook image spawned dynamically by jupyterhub's DockerSpawner
  # below (see jupyterhub/jupyterhub_config.py). Not run directly by compose --
  # `docker compose build jupyter-user-image` (or `up` once, which builds it)
  # just needs to produce the `whisperlab-jupyter-user:latest` tag that
  # DockerSpawner references.
  jupyter-user-image:
    build:
      context: jupyter
      dockerfile: Dockerfile
    image: whisperlab-jupyter-user:latest
    command: ["true"]

  jupyterhub:
    build:
      context: jupyterhub
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DOCKERSPAWNER_IMAGE: whisperlab-jupyter-user:latest
      DOCKERSPAWNER_NETWORK: lab-network
      DOCKERSPAWNER_MEM_LIMIT: 1G
      DOCKERSPAWNER_CPU_LIMIT: "1.0"
      JUPYTERHUB_HUB_IP: jupyterhub
      # Comma-separated usernames to auto-promote to JupyterHub admin.
      JUPYTERHUB_ADMIN_USERS: ""
    volumes:
      # DockerSpawner needs the host Docker socket to spawn per-user siblings.
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub-data:/srv/jupyterhub/data
    networks:
      - default
      - lab-network
    depends_on:
      jupyter-user-image:
        condition: service_completed_successfully

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # Set via `.env` / deploy secret: token from the Cloudflare Zero Trust
      # dashboard for a tunnel routing to jupyterhub:8000 and backend:8000.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - jupyterhub
      - backend

networks:
  lab-network:
    name: lab-network

volumes:
  pgdata:
  miniodata:
  jupyterhub-data:
  # Per-user persistent home directories, one named volume per username,
  # created automatically by DockerSpawner (jupyterhub-user-{username}).
