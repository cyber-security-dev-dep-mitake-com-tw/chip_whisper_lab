version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: whisperlab
      POSTGRES_PASSWORD: whisperlab
      POSTGRES_DB: whisperlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whisperlab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: whisperlab
      MINIO_ROOT_PASSWORD: whisperlab123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://whisperlab:whisperlab@postgres:5432/whisperlab
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: whisperlab
      MINIO_SECRET_KEY: whisperlab123
      WHISPERLAB_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./data:/data

  celery-worker:
    build:
      context: backend
      dockerfile: Dockerfile
    command: celery -A whisperlab.tasks worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://whisperlab:whisperlab@postgres:5432/whisperlab
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: whisperlab
      MINIO_SECRET_KEY: whisperlab123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./data:/data

  frontend:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  jupyter:
    build:
      context: jupyter
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: whisperlab
    volumes:
      - ./.vendor/chipwhisperer/jupyter:/home/jovyan/jupyter
      - ./data:/data

volumes:
  pgdata:
  miniodata:
